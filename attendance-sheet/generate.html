<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generate Attendance Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--m:#8B2635;--ml:#A63347;--mp:#F9EFF1;--bg:#F8F6F3;--bg2:#F1EDE8;--bd:#E2DAD4;--c:#1C1917;--c3:#78706A}
body{font:13px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--c);background:#5b4a4d}
.app{display:grid;grid-template-columns:350px 1fr;height:100vh}
aside{background:#fff;overflow-y:auto;border-right:1px solid var(--bd)}
aside h1{font:700 18px Lora,serif;padding:14px 16px;border-bottom:1px solid var(--bd)}
details{border-bottom:1px solid var(--bd)}summary{padding:10px 16px;font-weight:700;cursor:pointer;background:var(--bg)}
.bd{padding:10px 16px 14px;display:flex;flex-direction:column;gap:8px}
label{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--c3);display:block;margin-bottom:2px}
input[type=text],input[type=date],input[type=time],input[type=number],select{width:100%;padding:6px 8px;border:1.5px solid var(--bd);border-radius:6px;font:inherit;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--m)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;align-items:center;gap:6px;font-size:12px;margin:0;letter-spacing:0;color:var(--c);font-weight:500}
.ck input{accent-color:var(--m)}
.it{border:1px solid var(--bd);border-radius:7px;padding:6px;background:var(--bg);display:flex;flex-direction:column;gap:5px}
.r{display:flex;gap:5px;align-items:center}.r>*{flex:1}.r>button,.r>b{flex:0 0 auto}
button{font:600 12px inherit;padding:6px 10px;border-radius:6px;border:1.5px solid var(--bd);background:#fff;cursor:pointer}
button:hover{border-color:var(--m);color:var(--m)}
.pri{background:var(--m);color:#fff;border-color:var(--m)}.pri:hover{background:var(--ml);color:#fff}
.cls{display:flex;flex-direction:column;gap:3px;max-height:170px;overflow:auto}
main{overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bar{width:100%;display:flex;justify-content:space-between;align-items:center;color:#fff;gap:8px}
.bar div{display:flex;gap:8px}
#pv{display:flex;flex-direction:column;gap:16px;align-items:center}
.pw{box-shadow:0 4px 22px rgba(0,0,0,.35)}.pw .pg{transform-origin:0 0}
#empty{color:#fff;opacity:.8;padding:60px 0}
#probe{position:absolute;left:-99999px;top:0;visibility:hidden}
#toast{position:fixed;bottom:18px;right:18px;background:#1C1917;color:#fff;padding:9px 14px;border-radius:7px;display:none;z-index:9}
/* ===== SHEET (shared by preview, print, PDF) ===== */
.pg{box-sizing:border-box;width:var(--w);height:var(--h);padding:var(--mg);background:#fff;color:#111;font:var(--fs) 'Times New Roman',Times,serif;display:flex;flex-direction:column;overflow:hidden;page-break-after:always;break-after:page;position:relative}
.pg:last-child{page-break-after:auto;break-after:auto}
.pg *{box-sizing:border-box}
.in{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--ip)}
.in.b1{border:1px solid #111}.in.b2{border:3px double #111}.in.b3{border:2px solid #111;outline:1px solid #111;outline-offset:2px}
.hd{text-align:center;flex:none}
.lgs{display:flex;align-items:center;gap:4mm;justify-content:var(--lj)}
.lgs img{height:var(--lh);width:auto;max-width:40mm;object-fit:contain}
.fl{display:flex;align-items:center;gap:4mm}.fl .lgs{flex:1}.fl .tx{flex:4}
.cn{font-weight:700;line-height:1.2;font-size:var(--cs)}.es{font-size:.8em;margin-top:.5mm}
.dn{font-weight:700;font-size:calc(var(--cs) - 3pt);margin-top:1mm}.sb{font-style:italic;font-size:.9em;margin-top:.5mm}
.rl{border:0;margin:2mm 0;width:100%}.rl.t{border-top:1px solid #111}.rl.b{border-top:2.5px solid #111}.rl.d{border-top:3px double #111}
.ev{text-align:center;margin-bottom:2mm;flex:none}
.en{font-weight:700;text-transform:uppercase;font-size:calc(var(--fs) + 3pt);letter-spacing:.5px;border-bottom:1.5px solid #111;display:inline-block;padding-bottom:.5mm}
.et{font-style:italic;font-size:.95em;margin-top:1mm}.al{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:.9em;margin-top:1mm}
.mt{display:grid;grid-template-columns:1fr 1fr;border:1px solid #111;margin-bottom:2mm;flex:none}
.mt div{padding:.8mm 2mm;border-right:1px solid #111;border-bottom:1px solid #111;display:flex;gap:2mm;line-height:1.3}
.mt div:nth-child(2n){border-right:0}.mt div.fu{grid-column:1/-1;border-right:0}
.mt div:nth-last-child(-n+2):not(.fu):nth-child(odd),.mt div:last-child{border-bottom:0}
.mt b{white-space:nowrap}
.ch{display:flex;justify-content:space-between;border-bottom:1.5px solid #111;padding-bottom:1mm;margin-bottom:2mm;flex:none}
.ta{flex:1;min-height:0;overflow:hidden}
.sh{width:100%;border-collapse:collapse;table-layout:fixed}
.sh th,.sh td{border:1px solid #111;padding:0 1.2mm;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:center;font-size:var(--tf)}
.sh td{height:var(--rh)}.sh td.l{text-align:left}
.sh th{background:#ececec;font-weight:700;white-space:normal;line-height:1.15;padding:1mm;font-size:calc(var(--tf) + .5pt)}
.sh th small{font-weight:400;display:block}
.ft{flex:none;padding-top:3mm}
.tot{display:flex;justify-content:flex-end;gap:4mm;margin-bottom:4mm}
.tot div{border:1px solid #111;min-width:34mm;text-align:center}
.tot span{display:block;background:#ececec;font-size:.8em;font-weight:700;padding:.5mm;border-bottom:1px solid #111}
.tot em{display:block;font-style:normal;font-weight:700;font-size:15pt;height:9mm;line-height:9mm}
.sg{display:grid;column-gap:6mm;row-gap:4mm;align-items:start;border-top:1.5px solid #111;padding-top:3mm}
.sg>div{text-align:center;min-width:0}
.sl{height:var(--sh);border-bottom:1.5px var(--ls) #111;margin-bottom:1.2mm}
.sg b{display:block;font-size:.95em}.sg i{display:block;font-size:.85em}.sg small{display:block;font-size:.8em;color:#333}
.sg .dt{margin-top:3mm;font-size:.85em;font-weight:700}
.pn{flex:none;text-align:center;font-size:.8em;color:#444;border-top:1px dashed #999;margin-top:2mm;padding-top:1mm}
.fx{flex:none;text-align:center;font-size:.75em;font-style:italic;color:#555;margin-top:.5mm}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto}aside{max-height:60vh}}
</style></head><body>
<div class="app">
<aside>
<h1>Attendance Sheet Generator</h1>

<details open><summary>1 · Event</summary><div class="bd">
<div><label>EVENT NAME *</label><input type="text" id="ev-name" placeholder="e.g. Orientation Programme"></div>
<div class="g2"><div><label>EVENT TYPE</label><input type="text" id="ev-type" placeholder="Seminar / Workshop"></div><div><label>REF. NO.</label><input type="text" id="ev-ref"></div></div>
<div><label>VENUE</label><input type="text" id="ev-venue"></div>
<div class="g2"><div><label>START DATE</label><input type="date" id="ev-d1"></div><div><label>END DATE (multi-day)</label><input type="date" id="ev-d2"></div></div>
<div class="g2"><div><label>FROM</label><input type="time" id="ev-tf"></div><div><label>TO</label><input type="time" id="ev-tt"></div></div>
<div><label>MULTI-DAY LAYOUT</label><select id="ev-mode"><option value="cols">One sheet · a signature column per day</option><option value="sep">Separate sheet for each day</option></select></div>
<label class="ck"><input type="checkbox" id="ev-skip"> Skip Sundays in date range</label>
<div><label>RESOURCE PERSON</label><input type="text" id="ev-rp"></div>
<div><label>ORGANISED BY</label><input type="text" id="ev-org"></div>
</div></details>

<details open><summary>2 · Students</summary><div class="bd">
<div><label>ACADEMIC YEAR</label><select id="gen-ay"></select></div>
<div><label>CLASSES (one sheet set each)</label><div class="cls" id="cls"></div></div>
<div class="g2"><div><label>SEMESTER</label><input type="text" id="gen-sem" placeholder="all"></div><div><label>SHIFT</label><input type="text" id="gen-shift" placeholder="all"></div></div>
<div class="g2"><div><label>GENDER</label><select id="gen-g"><option value="">All</option><option>Male</option><option>Female</option><option>Transgender</option></select></div>
<div><label>SORT BY</label><select id="gen-sort"><option value="deptno">Dept. No.</option><option value="name">Name</option><option value="batch">Batch</option></select></div></div>
</div></details>

<details><summary>3 · Print on sheet (show / hide)</summary><div class="bd" id="shows"></div></details>

<details><summary>4 · Header & logos</summary><div class="bd">
<div><label>COLLEGE</label><input type="text" id="hdr-college"></div>
<div><label>AFFILIATION LINE</label><input type="text" id="hdr-est"></div>
<div><label>DEPARTMENT</label><input type="text" id="hdr-dept"></div>
<div><label>SUBTITLE 1</label><input type="text" id="hdr-sub1"></div>
<div><label>SUBTITLE 2</label><input type="text" id="hdr-sub2"></div>
<div class="g2"><div><label>COLLEGE NAME SIZE</label><select id="hdr-sz"><option value="13">Small</option><option value="15" selected>Medium</option><option value="18">Large</option></select></div>
<div><label>HEADER LINE</label><select id="hdr-rule"><option value="b">Bold</option><option value="t">Thin</option><option value="d">Double</option><option value="">None</option></select></div></div>
<div class="g2"><div><label>LOGO LAYOUT</label><select id="logo-lay"><option value="above">Above the name</option><option value="flank">Left &amp; right of name</option></select></div>
<div><label>LOGO ALIGN</label><select id="logo-pos"><option value="center">Center</option><option value="flex-start">Left</option><option value="flex-end">Right</option></select></div></div>
<div><label>LOGO HEIGHT (mm)</label><input type="number" id="logo-h" value="16" min="8" max="35"></div>
<label>LOGOS · tick to show · arrows set order</label><div id="logos" class="bd" style="padding:0"></div>
<div class="r"><input type="text" id="logo-new" placeholder="Paste image URL"><button onclick="addLogo()">Add</button></div>
</div></details>

<details><summary>5 · Table columns</summary><div class="bd">
<div id="cols" style="display:flex;flex-direction:column;gap:5px"></div>
<div><label>SIGNATURE COLUMN NAMES (comma separated)</label><input type="text" id="sig-cols" value="Signature"></div>
</div></details>

<details><summary>6 · Signatures</summary><div class="bd">
<div id="sigs" style="display:flex;flex-direction:column;gap:6px"></div>
<div class="r"><select id="sig-preset"></select><button onclick="addSig()">Add</button></div>
<div class="g2"><div><label>ALIGNMENT</label><select id="sig-al"><option value="spread">Spread evenly</option><option value="end">Right</option><option value="start">Left</option><option value="center">Center</option></select></div>
<div><label>LINE STYLE</label><select id="sig-ls"><option>solid</option><option>dashed</option><option>dotted</option></select></div></div>
<div class="g2"><div><label>SIGNING SPACE (mm)</label><input type="number" id="sig-h" value="14" min="6" max="40"></div>
<div><label>DATE LINE</label><select id="sig-dt"><option value="">None</option><option value="1">Under every signature</option></select></div></div>
</div></details>

<details><summary>7 · Page layout</summary><div class="bd">
<div class="g2"><div><label>PAPER</label><select id="lay-or"><option value="portrait">A4 Portrait</option><option value="landscape">A4 Landscape</option></select></div>
<div><label>MARGIN</label><select id="lay-mg"><option value="8">Narrow</option><option value="12" selected>Normal</option><option value="18">Wide</option></select></div></div>
<div class="g2"><div><label>ROW HEIGHT (mm)</label><input type="number" id="lay-rh" value="7.5" min="4.6" max="16" step=".5"></div>
<div><label>FONT (pt)</label><input type="number" id="lay-fs" value="10" min="8" max="13"></div></div>
<div><label>PAGE BORDER</label><select id="lay-bd"><option value="0">None</option><option value="1">Thin</option><option value="2">Double</option><option value="3">Box</option></select></div>
<label class="ck"><input type="checkbox" id="lay-fit" checked> Shrink rows to fit each class on one page (min 4.6 mm)</label>
<label class="ck"><input type="checkbox" id="sh-tot" checked> Total enrolled / present boxes</label>
<label class="ck"><input type="checkbox" id="sh-pn" checked> Page numbers</label>
<div><label>FOOTER TEXT</label><input type="text" id="footer-txt"></div>
</div></details>
</aside>

<main><div class="bar"><span id="cnt">Fill the event name and pick a class</span>
<div><button onclick="doPrint()">Print</button><button class="pri" onclick="dlPDF()">Download PDF</button></div></div>
<div id="empty">Live preview appears here.</div><div id="pv"></div></main>
</div>
<div id="probe"></div><div id="toast"></div>
<style id="sheetcss-note"></style>

<script>
const GAS='https://script.google.com/macros/s/AKfycbxWWpiTVJZ6O-oPXIJ4h6W4JMmOfABONQfrwcQ0rh-K_6TnRFWHrFI7mYwjEZLadTjWsw/exec';
const $=i=>document.getElementById(i),g=i=>{const e=$(i);return!e?'':e.type==='checkbox'?e.checked:e.value.trim()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function gas(a,p){const r=await fetch(GAS+'?'+new URLSearchParams({action:a,payload:JSON.stringify(p||{})}));if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
const R=(()=>{let t;return()=>{clearTimeout(t);t=setTimeout(render,250)}})();
let ST=[],STAFF=[],AY=[],CLS=[],CFG={};
const pd=s=>{if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);const d=new Date(s);return isNaN(d)?null:d};
const fd=(d,l)=>d?d.toLocaleDateString('en-IN',{day:'2-digit',month:l?'long':'short',year:'numeric'}):'';
const wd=d=>d.toLocaleDateString('en-US',{weekday:'long'});
const ft=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+(h>=12?' PM':' AM')};
const mv=(a,i,d,f)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];f();R()};

/* ---------- state lists ---------- */
const SHOWS=[['class','Class',1],['ay','Academic year',1],['evtype','Event type',1],['sem','Semester',0],['shift','Shift',0],['venue','Venue',1],['date','Date',1],['time','Time',1],['rp','Resource person',1],['org','Organised by',1],['ref','Ref. no.',0],['title','"— Attendance Sheet —" label',1]];
$('shows').innerHTML=SHOWS.map(s=>`<label class="ck"><input type="checkbox" id="sh-${s[0]}" ${s[2]?'checked':''} onchange="R()"> ${s[1]}</label>`).join('');
let COLS=[{id:'sno',l:'S.No.',en:1,w:10},{id:'deptno',l:'Dept. No.',en:1,w:26},{id:'name',l:'Student Name',en:1,w:''},{id:'gender',l:'Gender',w:16},{id:'class',l:'Class'},{id:'batch',l:'Batch',w:16},{id:'sem',l:'Sem',w:12},{id:'shift',l:'Shift',w:14},{id:'sec',l:'Section',w:14},{id:'dob',l:'DOB',w:24},{id:'contact',l:'Contact'},{id:'email',l:'Email'},{id:'father',l:"Father's Name"},{id:'pcon',l:'Parent Contact'}];
const VAL={deptno:s=>s.DeptNo,name:s=>s.Name,gender:s=>s.Gender,class:s=>s.Class,batch:s=>s.Batch,sem:s=>s.Semester,shift:s=>s.Shift,sec:s=>s.Section,dob:s=>fd(pd(s.DOB)),contact:s=>s.Contact,email:s=>s.Email,father:s=>s.Father,pcon:s=>s.ParentContact};
const LEFT=['name','class','contact','email','father','pcon'];
function colUI(){$('cols').innerHTML=COLS.map((c,i)=>`<div class="r"><input type="checkbox" ${c.en?'checked':''} ${c.id==='sno'||c.id==='name'?'disabled':''} onchange="COLS[${i}].en=this.checked;R()" style="flex:0 0 auto"><span style="flex:2">${esc(c.l)}</span><input type="number" placeholder="auto mm" value="${c.w||''}" style="max-width:76px" oninput="COLS[${i}].w=this.value;R()"><button onclick="mv(COLS,${i},-1,colUI)">↑</button><button onclick="mv(COLS,${i},1,colUI)">↓</button></div>`).join('')}
let LOGOS=[];
function logoUI(){$('logos').innerHTML=LOGOS.map((l,i)=>`<div class="it"><div class="r"><input type="checkbox" ${l.en?'checked':''} onchange="LOGOS[${i}].en=this.checked;R()" style="flex:0 0 auto"><img src="${esc(l.url)}" style="height:26px;max-width:40px;object-fit:contain;flex:0 0 auto" onerror="this.style.opacity=.2"><input type="text" value="${esc(l.label)}" oninput="LOGOS[${i}].label=this.value"><button onclick="mv(LOGOS,${i},-1,logoUI)">↑</button><button onclick="mv(LOGOS,${i},1,logoUI)">↓</button><button onclick="LOGOS.splice(${i},1);logoUI();R()">×</button></div></div>`).join('')}
function addLogo(){const u=g('logo-new');if(!u)return;LOGOS.push({url:u,label:'Custom',en:1});$('logo-new').value='';logoUI();R()}
const PRE=['Head of the Department','Staff In-charge','Attendance Secretary (Student)','Association Secretary','Principal','Rector','Vice Principal','Custom'];
$('sig-preset').innerHTML=PRE.map(p=>`<option>${p}</option>`).join('');
let SIGS=[{n:'',d:'Head of the Department',x:''}];
function addSig(){const p=g('sig-preset');SIGS.push({n:'',d:p==='Custom'?'':p,x:''});sigUI();R()}
function sigStaff(i,id){const s=STAFF.find(x=>x.ID===id);if(!s)return;SIGS[i].n=s.Name;if(s.Designation&&!/^(Head|Staff In|Attend|Assoc)/.test(SIGS[i].d))SIGS[i].d=s.Designation;SIGS[i].x=SIGS[i].x||s.Department||'';sigUI();R()}
function sigUI(){const opts='<option value="">Fill from staff…</option>'+STAFF.filter(x=>x.Active!=='FALSE').map(x=>`<option value="${esc(x.ID)}">${esc(x.Name)}</option>`).join('');
$('sigs').innerHTML=SIGS.map((s,i)=>`<div class="it"><div class="r"><b>${i+1}</b><select onchange="sigStaff(${i},this.value)">${opts}</select><button onclick="mv(SIGS,${i},-1,sigUI)">↑</button><button onclick="mv(SIGS,${i},1,sigUI)">↓</button><button onclick="SIGS.splice(${i},1);sigUI();R()">×</button></div>
<input type="text" placeholder="Name" value="${esc(s.n)}" oninput="SIGS[${i}].n=this.value;R()"><input type="text" placeholder="Designation" value="${esc(s.d)}" oninput="SIGS[${i}].d=this.value;R()"><input type="text" placeholder="Department / extra line (optional)" value="${esc(s.x)}" oninput="SIGS[${i}].x=this.value;R()"></div>`).join('')}

/* ---------- boot ---------- */
async function boot(){
  colUI();sigUI();
  const dl=['https://loyolazoology.github.io/administrative-cell/attendance-sheet/assets/loyola.png','Loyola College'],d2=['https://loyolazoology.github.io/administrative-cell/attendance-sheet/assets/100.png','Centenary'],d3=['https://loyolazoology.github.io/administrative-cell/attendance-sheet/assets/azbt-logo.png','Department'];
  try{
    const[a,b,c,d,e]=await Promise.all([gas('getStudents'),gas('getStaff'),gas('getAcademicYears'),gas('getClasses'),gas('getConfig')]);
    ST=a.data||[];STAFF=b.data||[];AY=c.data||[];CLS=d.data||[];CFG=e.data||{};
  }catch(x){toast('Could not load data: '+x.message)}
  $('hdr-college').value=CFG.college_name||'Loyola College (Autonomous), Chennai – 600 034';
  $('hdr-est').value=CFG.college_est||'';$('hdr-dept').value=CFG.dept_name||'';
  $('hdr-sub1').value=CFG.subtitle1||'';$('hdr-sub2').value=CFG.subtitle2||'';$('footer-txt').value=CFG.watermark||'';
  let L=[];try{L=JSON.parse(CFG.logos||'[]')}catch(e){}
  if(!L.length&&CFG.logo1_url)L=[{url:CFG.logo1_url,label:'College'}];
  if(CFG.logo2_url)L.push({url:CFG.logo2_url,label:'Second logo'});
  LOGOS=L.filter(x=>x.url).map(x=>({url:x.url,label:x.label||'Logo',en:1}));
  [dl,d2,d3].forEach(x=>{if(!LOGOS.some(l=>l.url===x[0]))LOGOS.push({url:x[0],label:x[1],en:0})});
  logoUI();
  const act=AY.find(x=>String(x.Active).toUpperCase()==='TRUE');
  $('gen-ay').innerHTML=AY.map(x=>`<option ${act&&x.ID===act.ID?'selected':''}>${esc(x.Label)}</option>`).join('');
  buildCls();
  document.querySelectorAll('aside input,aside select').forEach(el=>{if(!el.hasAttribute('oninput')&&!el.hasAttribute('onchange')){el.addEventListener('input',R);el.addEventListener('change',R)}});
  $('gen-ay').addEventListener('change',buildCls);
  render();
}
function uniq(a){const m=new Map();a.forEach(s=>m.set(s.DeptNo||(s.Name+'|'+s.DOB),s));return[...m.values()]}
function buildCls(){
  const ay=g('gen-ay'),sts=uniq(ST.filter(s=>s.AcademicYear===ay&&s.Active!=='FALSE')),map={};
  sts.forEach(s=>{const k=s.Class+(s.Section?' — '+s.Section:'');map[k]=(map[k]||0)+1});
  const ord=CLS.map(c=>c.Label),keys=Object.keys(map).sort((a,b)=>{const x=ord.findIndex(o=>a.startsWith(o)),y=ord.findIndex(o=>b.startsWith(o));return(x<0?99:x)-(y<0?99:y)||a.localeCompare(b)});
  $('cls').innerHTML=keys.map(k=>`<label class="ck"><input type="checkbox" value="${esc(k)}" onchange="R()"> ${esc(short(k))} <span style="color:var(--c3)">(${map[k]})</span></label>`).join('')||'<span style="color:var(--c3)">No students for this year.</span>';
  R();
}
function short(k){const p=k.split(' — '),c=CLS.find(x=>x.Label===p[0]);return(c&&c.Short||p[0])+(p[1]?' — '+p[1]:'')}
function students(chip){
  const p=chip.split(' — '),cls=p[0],sec=p[1],ay=g('gen-ay');
  let s=uniq(ST.filter(x=>x.Class===cls&&x.AcademicYear===ay&&x.Active!=='FALSE'));
  if(sec)s=s.filter(x=>x.Section===sec);
  if(g('gen-sem'))s=s.filter(x=>x.Semester===g('gen-sem'));
  if(g('gen-shift'))s=s.filter(x=>x.Shift===g('gen-shift'));
  if(g('gen-g'))s=s.filter(x=>x.Gender===g('gen-g'));
  const k=g('gen-sort');
  return s.sort((a,b)=>k==='name'?(a.Name||'').localeCompare(b.Name||''):k==='batch'?(a.Batch||'').localeCompare(b.Batch||''):(a.DeptNo||'').localeCompare(b.DeptNo||'',undefined,{numeric:true}));
}
function days(){const a=pd(g('ev-d1')),b=pd(g('ev-d2'));if(!a)return[null];if(!b||b<=a)return[a];const r=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){if(g('ev-skip')&&d.getDay()===0)continue;r.push(new Date(d))}return r.length?r:[a]}

/* ---------- sheet html ---------- */
function hdr(c){
  const o=c.o,lg=LOGOS.filter(l=>l.en).map(l=>`<img src="${esc(l.url)}" crossorigin="anonymous" onerror="this.style.display='none'">`);
  const tx=`<div class="tx"><div class="cn">${esc(g('hdr-college'))}</div>${g('hdr-est')?`<div class="es">${esc(g('hdr-est'))}</div>`:''}<div class="dn">${esc(g('hdr-dept'))}</div>${g('hdr-sub1')?`<div class="sb">${esc(g('hdr-sub1'))}</div>`:''}${g('hdr-sub2')?`<div class="sb">${esc(g('hdr-sub2'))}</div>`:''}</div>`;
  let top;
  if(g('logo-lay')==='flank'&&lg.length>1){const h=Math.ceil(lg.length/2);top=`<div class="fl"><div class="lgs" style="--lj:flex-start">${lg.slice(0,h).join('')}</div>${tx}<div class="lgs" style="--lj:flex-end">${lg.slice(h).join('')}</div></div>`}
  else top=(lg.length?`<div class="lgs" style="margin-bottom:1.5mm">${lg.join('')}</div>`:'')+tx;
  const M=[['Class',c.sn,'class'],['Academic Year',g('gen-ay'),'ay'],['Semester',g('gen-sem'),'sem'],['Shift',g('gen-shift'),'shift'],['Venue',g('ev-venue'),'venue'],['Date',c.dtxt,'date'],['Time',c.time,'time'],['Resource Person',g('ev-rp'),'rp'],['Organised by',g('ev-org'),'org'],['Ref. No.',g('ev-ref'),'ref']].filter(m=>m[1]&&g('sh-'+m[2]));
  const mt=M.map((m,i)=>`<div class="${i===M.length-1&&M.length%2?'fu':''}"><b>${m[0]}:</b><span>${esc(m[1])}</span></div>`).join('');
  return`<div class="hd">${top}${o.rule?`<hr class="rl ${o.rule}">`:'<div style="height:2mm"></div>'}</div>
  <div class="ev"><span class="en">${esc(g('ev-name'))}</span>${g('sh-evtype')&&g('ev-type')?`<div class="et">${esc(g('ev-type'))}</div>`:''}${g('sh-title')?'<div class="al">— Attendance Sheet —</div>':''}</div>${mt?`<div class="mt">${mt}</div>`:''}`;
}
function tbl(c,p){
  const th=c.cols.map(x=>`<th ${c.two?'rowspan="2"':''}>${esc(x.l)}</th>`).join('');
  let h;
  if(c.multi&&c.names.length>1)h=`<tr>${th}${c.D.map((d,i)=>`<th colspan="${c.names.length}">Day ${i+1}<small>${fd(d)}</small></th>`).join('')}</tr><tr>${c.D.map(()=>c.names.map(n=>`<th>${esc(n)}</th>`).join('')).join('')}</tr>`;
  else if(c.multi)h=`<tr>${th}${c.D.map((d,i)=>`<th>Day ${i+1}<small>${fd(d)}</small></th>`).join('')}</tr>`;
  else h=`<tr>${th}${c.names.map(n=>`<th>${esc(n)}</th>`).join('')}</tr>`;
  const cg='<colgroup>'+c.w.map(w=>`<col style="width:${w}mm">`).join('')+'</colgroup>';
  const sg=c.multi?c.D.length*c.names.length:c.names.length;
  const body=p.rows.map((s,i)=>`<tr>${c.cols.map(x=>`<td class="${LEFT.includes(x.id)?'l':''}">${x.id==='sno'?p.start+i+1:esc(VAL[x.id](s)||'')}</td>`).join('')}${'<td></td>'.repeat(sg)}</tr>`).join('');
  return`<table class="sh">${cg}<thead>${h}</thead><tbody>${body}</tbody></table>`;
}
function foot(c){
  const o=c.o,S=SIGS.filter(s=>s.n||s.d),n=Math.max(1,Math.min(S.length,5));
  const cols=o.al==='spread'?`repeat(${n},1fr)`:`repeat(${n},minmax(0,48mm))`;
  const sg=S.length?`<div class="sg" style="grid-template-columns:${cols};justify-content:${o.al==='spread'?'stretch':o.al}">${S.map(s=>`<div><div class="sl"></div><b>${esc(s.n)}</b><i>${esc(s.d)}</i>${s.x?`<small>${esc(s.x)}</small>`:''}${g('sig-dt')?'<div class="dt">Date: ____ / ____ / ______</div>':''}</div>`).join('')}</div>`:'';
  const t=g('sh-tot')?`<div class="tot"><div><span>TOTAL ENROLLED</span><em>${c.N}</em></div><div><span>TOTAL PRESENT</span><em></em></div></div>`:'';
  return`<div class="ft">${t}${sg}</div>`;
}
function pageHTML(c,p){
  const head=p.first?hdr(c):`<div class="ch"><b>${esc(g('ev-name'))}</b><span>${esc(c.dtxt)}${c.dtxt?' | ':''}${esc(c.sn)}</span></div>`;
  const pn=g('sh-pn')?`<div class="pn">Page ${p.idx} of ${p.n} | ${esc(c.sn)}</div>`:'',fx=g('footer-txt')?`<div class="fx">${esc(g('footer-txt'))}</div>`:'';
  const o=c.o;
  return`<div class="pg" style="--w:${o.W}mm;--h:${o.H}mm;--mg:${o.mg}mm;--ip:${o.bd?'3mm':'0'};--fs:${o.fs}pt;--cs:${o.cs}pt;--lh:${o.lh}mm;--lj:${o.lj};--rh:${c.rh}mm;--tf:${c.tf}pt;--sh:${o.sh}mm;--ls:${o.ls}"><div class="in b${o.bd}">${head}<div class="ta">${tbl(c,p)}</div>${p.last?foot(c):''}${pn}${fx}</div></div>`;
}
function cap(c,first,last){
  const h=$('probe');h.innerHTML=pageHTML(c,{first,last,rows:[{Name:'x'}],start:0,idx:1,n:1});
  const ta=h.querySelector('.ta'),th=h.querySelector('thead'),tr=h.querySelector('tbody tr');
  return Math.max(1,Math.floor((ta.clientHeight-th.offsetHeight-4)/tr.offsetHeight));
}
function build(){
  const sel=[...document.querySelectorAll('#cls input:checked')].map(i=>i.value);
  if(!g('ev-name')||!sel.length)return{html:'',n:0};
  const land=g('lay-or')==='landscape',mg=+g('lay-mg'),cs=+g('hdr-sz');
  const o={W:land?297:210,H:land?210:297,land,mg,bd:g('lay-bd'),fs:+g('lay-fs')||10,cs,lh:+g('logo-h')||16,lj:g('logo-pos'),rule:g('hdr-rule'),al:g('sig-al'),sh:+g('sig-h')||14,ls:g('sig-ls')};
  const D=days(),sep=D.length>1&&g('ev-mode')==='sep',multi=D.length>1&&!sep;
  const names=(g('sig-cols')||'Signature').split(',').map(s=>s.trim()).filter(Boolean);
  const enc=COLS.filter(c=>c.en||c.id==='sno'||c.id==='name');
  const time=ft(g('ev-tf'))&&ft(g('ev-tt'))?ft(g('ev-tf'))+' – '+ft(g('ev-tt')):ft(g('ev-tf'))||ft(g('ev-tt'));
  let html='',total=0;const units=[];
  sel.forEach(chip=>{const sts=students(chip);if(!sts.length)return;(sep?D:[D[0]]).forEach((d,i)=>units.push({chip,sts,d,i}))});
  units.forEach(u=>{
    const dtxt=sep?`${fd(u.d,1)} (${wd(u.d)}) — Day ${u.i+1} of ${D.length}`:multi?`${fd(D[0],1)} – ${fd(D[D.length-1],1)}`:u.d?`${fd(u.d,1)} (${wd(u.d)})`:'';
    const sgN=multi?D.length*names.length:names.length;
    const availW=o.W-2*mg-(o.bd?6:0);
    let fixed=0,wt=0;enc.forEach(x=>{if(+x.w)fixed+=+x.w;else wt+=x.id==='name'?2:1});
    const sw=sgN<=2?2.2:1.3;wt+=sgN*sw;const unit=Math.max(4,(availW-fixed)/wt);
    const w=enc.map(x=>+x.w||unit*(x.id==='name'?2:1)).concat(Array(sgN).fill(unit*sw)).map(v=>v.toFixed(2));
    const c={o,cols:enc,names,D,multi,two:multi&&names.length>1,w,dtxt,time,sn:short(u.chip),N:u.sts.length,rh:+g('lay-rh')||7.5,tf:o.fs-.5};
    const tfOf=rh=>Math.min(o.fs-.5,Math.max(6.5,(rh*2.83-1.5)/1.25));
    c.tf=tfOf(c.rh);
    if(g('lay-fit')){const base=c.rh;let ok=false;for(let rh=base;rh>=4.6;rh-=.2){c.rh=+rh.toFixed(2);c.tf=tfOf(c.rh);if(cap(c,1,1)>=c.N){ok=true;break}}if(!ok){c.rh=base;c.tf=tfOf(base)}}
    const c1l=cap(c,1,1),c1=cap(c,1,0),cml=cap(c,0,1),cm=cap(c,0,0),L=[];
    let pos=0,first=1;const N=c.N;
    while(pos<N){const rem=N-pos,cl=first?c1l:cml,cn=first?c1:cm;
      if(rem<=cl){L.push([pos,rem,first,1]);break}
      let t=rem<=cn?rem-Math.min(cml,rem-1):cn;t=Math.max(1,t);L.push([pos,t,first,0]);pos+=t;first=0}
    L.forEach((p,i)=>{html+=pageHTML(c,{first:p[2],last:p[3],rows:u.sts.slice(p[0],p[0]+p[1]),start:p[0],idx:i+1,n:L.length});total++});
  });
  return{html,n:total,o};
}
function render(){
  const{html,n}=build(),pv=$('pv');
  $('probe').innerHTML='';
  if(!n){pv.innerHTML='';$('empty').style.display='block';$('cnt').textContent=g('ev-name')?'Pick at least one class':'Fill the event name and pick a class';return}
  $('empty').style.display='none';pv.innerHTML=html;
  const land=g('lay-or')==='landscape',pw=(land?297:210)*3.7795,ph=(land?210:297)*3.7795,sc=Math.min(1,($('pv').parentElement.clientWidth-30)/pw);
  pv.querySelectorAll('.pg').forEach(p=>{const w=document.createElement('div');w.className='pw';w.style.cssText=`width:${pw*sc}px;height:${ph*sc}px;overflow:hidden`;p.replaceWith(w);w.appendChild(p);p.style.transform=`scale(${sc})`});
  $('cnt').textContent=n+' page'+(n>1?'s':'')+' · '+(land?'A4 landscape':'A4 portrait');
}
function sheetCSS(){return[...document.styleSheets].flatMap(s=>{try{return[...s.cssRules]}catch(e){return[]}}).map(r=>r.cssText).filter(t=>/^\.(pg|in|hd|lgs|fl|cn|es|dn|sb|rl|ev|en|et|al|mt|ch|ta|sh|ft|tot|sg|sl|pn|fx)\b/.test(t)).join('\n')}
function doPrint(){
  const{html,n,o}=build();if(!n)return toast('Enter the event name and select a class.');
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  f.contentDocument.open();f.contentDocument.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(g('ev-name'))}</title><style>${sheetCSS()}@page{size:A4 ${o.land?'landscape':'portrait'};margin:0}html,body{margin:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body>${html}</body></html>`);
  f.contentDocument.close();
  const go=()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),4000)};
  const imgs=[...f.contentDocument.images];Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))).then(()=>setTimeout(go,150));
  logIt(n);
}
let H2P;
async function dlPDF(){
  const{html,n,o}=build();if(!n)return toast('Enter the event name and select a class.');
  toast('Preparing PDF…');
  if(!window.html2pdf)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';s.onload=ok;s.onerror=()=>no(Error('PDF library failed to load'));document.head.appendChild(s)}).catch(e=>toast(e.message));
  if(!window.html2pdf)return;
  const h=document.createElement('div');h.style.cssText='position:fixed;left:0;top:0;z-index:-1';h.innerHTML=html;document.body.appendChild(h);
  h.querySelectorAll('.pg').forEach(p=>p.style.setProperty('--h',(o.H-.6)+'mm'));
  const name=`${short([...document.querySelectorAll('#cls input:checked')][0].value).replace(/[^\w ]/g,' ').trim().slice(0,20)} - ${g('ev-name').replace(/[^\w ]/g,' ').slice(0,20).trim()}.pdf`;
  try{await html2pdf().set({margin:0,filename:name,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,scrollY:0,scrollX:0},jsPDF:{unit:'mm',format:'a4',orientation:o.land?'landscape':'portrait'},pagebreak:{mode:['css'],after:'.pg'}}).from(h).save();toast('PDF downloaded.');logIt(n)}
  catch(e){toast('PDF failed: '+e.message+' — use Print → Save as PDF.')}
  h.remove();
}
function logIt(n){gas('addLog',{user:(()=>{try{return JSON.parse(sessionStorage.getItem('azb_user')).username}catch(e){return'user'}})(),action:'SHEET GENERATED',detail:`"${g('ev-name')}" — ${n} page(s)`}).catch(()=>{})}
window.addEventListener('resize',R);
boot();
</script></body></html>
