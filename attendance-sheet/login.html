<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — AZB Attendance System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --maroon:#8B2635;--maroon-light:#A63347;--maroon-pale:#F9EFF1;
  --gold:#C49A3C;--gold-light:#D4AF5A;
  --bg:#F8F6F3;--bg2:#F1EDE8;--white:#FFFFFF;
  --c:#1C1917;--c2:#3D3530;--c3:#78706A;--c4:#B0A89F;
  --border:#E2DAD4;--border2:#EDE8E3;
  --red:#8B2020;--red-bg:#FDF0F0;--red-border:#F0BFBF;
  --font-serif:'Lora',Georgia,serif;
  --font-sans:'Plus Jakarta Sans',system-ui,sans-serif;
}
html,body{
  min-height:100vh;background:var(--bg);
  font-family:var(--font-sans);color:var(--c);
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
body{
  background:
    radial-gradient(ellipse 600px 400px at 15% 25%,rgba(139,38,53,.06) 0%,transparent 70%),
    radial-gradient(ellipse 500px 350px at 85% 75%,rgba(196,154,60,.05) 0%,transparent 70%),
    var(--bg);
}
.wrap{width:100%;max-width:440px;position:relative;z-index:1}

/* CARD */
.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.10),0 4px 12px rgba(0,0,0,.05);
}

/* HEADER */
.card-header{
  background:linear-gradient(160deg,#5A1220 0%,#8B2635 50%,#A63347 100%);
  padding:30px 28px 26px;text-align:center;position:relative;overflow:hidden;
}
.card-header::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle at 30% 50%,rgba(255,255,255,.04) 0%,transparent 60%),
                   radial-gradient(circle at 70% 30%,rgba(196,154,60,.08) 0%,transparent 50%);
}
.card-header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(196,154,60,.6),var(--gold-light),rgba(196,154,60,.6),transparent);
}
.logo-strip{
  display:flex;align-items:center;justify-content:center;
  gap:12px;margin-bottom:14px;position:relative;z-index:1;flex-wrap:wrap;
}
.logo-img{
  width:54px;height:54px;object-fit:contain;
  background:rgba(255,255,255,.12);border-radius:8px;padding:4px;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.2));
}
.logo-sep{width:1px;height:42px;background:rgba(255,255,255,.18)}
.h-college{
  font-family:var(--font-serif);font-size:16.5px;font-weight:700;
  color:#fff;line-height:1.3;position:relative;z-index:1;
}
.h-dept{font-size:11px;color:rgba(255,255,255,.68);margin-top:4px;position:relative;z-index:1;line-height:1.5}
.h-sub{font-size:10px;color:rgba(255,255,255,.5);margin-top:3px;font-style:italic;position:relative;z-index:1}
.h-badge{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:12px;padding:5px 16px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.82);font-size:9.5px;letter-spacing:1.4px;
  text-transform:uppercase;border-radius:20px;position:relative;z-index:1;font-weight:600;
}

/* BODY */
.card-body{padding:24px 28px 28px}

/* ROLE TABS */
.role-tabs{
  display:grid;grid-template-columns:1fr 1fr;
  border:1.5px solid var(--border);border-radius:8px;
  overflow:hidden;margin-bottom:20px;background:var(--bg2);
}
.rtab{
  padding:10px;text-align:center;font-size:13px;font-weight:600;
  cursor:pointer;background:transparent;border:none;color:var(--c3);
  transition:all .18s;font-family:var(--font-sans);
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.rtab i{font-size:13px}
.rtab.active{background:var(--maroon);color:#fff}
.rtab:not(.active):hover{background:rgba(139,38,53,.06);color:var(--maroon)}

/* ERROR */
.login-err{
  background:var(--red-bg);border:1.5px solid var(--red-border);
  border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--red);
  margin-bottom:14px;display:none;align-items:center;gap:8px;
}
.login-err.show{display:flex}

/* FIELDS */
.field-wrap{margin-bottom:14px}
.field-wrap label{
  display:block;font-size:10px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--c3);margin-bottom:6px;
}
.inp-wrap{position:relative}
.inp-wrap .ico{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--c4);font-size:13px;pointer-events:none;transition:color .15s;
}
.inp-wrap input{
  width:100%;padding:10px 11px 10px 36px;
  border:1.5px solid var(--border);border-radius:7px;
  background:var(--bg2);font-size:13px;color:var(--c);
  font-family:var(--font-sans);transition:all .18s;
}
.inp-wrap input:focus{
  outline:none;border-color:var(--maroon);background:#fff;
  box-shadow:0 0 0 3px rgba(139,38,53,.07);
}
.inp-wrap:focus-within .ico{color:var(--maroon)}
.pw-eye{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--c4);font-size:13px;
  padding:4px;transition:color .15s;
}
.pw-eye:hover{color:var(--maroon)}

/* SUBMIT */
.btn-submit{
  width:100%;padding:11px;background:var(--maroon);border:none;
  border-radius:8px;color:#fff;font-family:var(--font-sans);
  font-size:13.5px;font-weight:700;cursor:pointer;
  transition:all .22s;
  box-shadow:0 4px 14px rgba(139,38,53,.25);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-submit:hover{
  background:var(--maroon-light);
  box-shadow:0 6px 20px rgba(139,38,53,.35);
  transform:translateY(-1px);
}
.btn-submit:active{transform:none}
.btn-submit .spin-ico{display:none;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-submit.loading .spin-ico{display:inline}
.btn-submit.loading .main-ico{display:none}

.login-note{
  text-align:center;font-size:10.5px;color:var(--c4);
  margin-top:12px;display:flex;align-items:center;
  justify-content:center;gap:5px;
}

/* WATERMARK */
.watermark{
  text-align:center;margin-top:20px;
  font-size:10.5px;color:var(--c4);line-height:1.7;
}
.watermark strong{font-weight:600;color:var(--c3)}

/* LOADER */
#page-loader{
  position:fixed;inset:0;background:rgba(248,246,243,.95);
  z-index:9999;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
}
.lring{width:36px;height:36px;border:2.5px solid var(--border);border-top-color:var(--maroon);border-radius:50%;animation:spin .7s linear infinite}
#page-loader span{font-size:12px;color:var(--c3);font-weight:500}
</style>
</head>
<body>

<div id="page-loader" style="display:none"><div class="lring"></div><span>Signing in…</span></div>

<div class="wrap">
  <div class="card">
    <div class="card-header">
      <div class="logo-strip">
        <img class="logo-img" id="hdr-logo1" src="https://static.wixstatic.com/media/81ba89_81dcdb9d1e384b618fdc78760c61c426~mv2.png" alt="Loyola Logo" onerror="this.style.display='none'">
        <span id="hdr-logo2-wrap" style="display:none">
          <span class="logo-sep"></span>
          <img class="logo-img" id="hdr-logo2" src="" alt="" onerror="this.parentElement.style.display='none'">
        </span>
      </div>
      <div class="h-college" id="hdr-college">Loyola College (Autonomous)</div>
      <div class="h-dept" id="hdr-dept">PG &amp; Research Department of Advanced Zoology &amp; Biotechnology</div>
      <div class="h-sub" id="hdr-sub" style="display:none"></div>
      <div class="h-badge">Attendance Management System</div>
    </div>

    <div class="card-body">
      <div class="role-tabs">
        <button class="rtab active" id="tab-admin" onclick="setRole('admin',this)">
          <i class="fa-solid fa-user-shield"></i>Admin / HOD
        </button>
        <button class="rtab" id="tab-staff" onclick="setRole('staff',this)">
          <i class="fa-solid fa-chalkboard-user"></i>Staff
        </button>
      </div>

      <div class="login-err" id="login-err">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="err-msg">Invalid credentials.</span>
      </div>

      <div class="field-wrap">
        <label><i class="fa-solid fa-user" style="margin-right:4px;opacity:.5;font-size:9px"></i>Username / ID</label>
        <div class="inp-wrap">
          <i class="ico fa-solid fa-user"></i>
          <input id="inp-user" type="text" placeholder="Enter your username" autocomplete="username">
        </div>
      </div>

      <div class="field-wrap">
        <label><i class="fa-solid fa-lock" style="margin-right:4px;opacity:.5;font-size:9px"></i>Password</label>
        <div class="inp-wrap">
          <i class="ico fa-solid fa-lock"></i>
          <input id="inp-pw" type="password" placeholder="Enter your password" autocomplete="current-password">
          <button class="pw-eye" type="button" onclick="togglePw()" tabindex="-1">
            <i class="fa-regular fa-eye" id="pw-ico"></i>
          </button>
        </div>
      </div>

      <button class="btn-submit" id="btn-login" onclick="doLogin()">
        <i class="fa-solid fa-spinner spin-ico"></i>
        <i class="fa-solid fa-right-to-bracket main-ico"></i>
        <span id="btn-txt">Sign In</span>
      </button>

      <p class="login-note">
        <i class="fa-solid fa-lock" style="font-size:9px"></i>
        Authorised personnel only · Loyola College
      </p>
    </div>
  </div>

  <div class="watermark">
    <strong id="wm-dept">Department of AZ-BT, Loyola College</strong>
  </div>
</div>

<script>
const GAS='https://script.google.com/macros/s/AKfycbxWWpiTVJZ6O-oPXIJ4h6W4JMmOfABONQfrwcQ0rh-K_6TnRFWHrFI7mYwjEZLadTjWsw/exec';
let ROLE='admin';

// If already logged in, redirect
try{
  const s=JSON.parse(sessionStorage.getItem('azb_user'));
  if(s&&s.role) window.location.href=s.role==='admin'?'admin.html':'admin.html';
}catch(e){}

function setRole(r,el){
  ROLE=r;
  document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}
function togglePw(){
  const i=document.getElementById('inp-pw'),ico=document.getElementById('pw-ico');
  i.type=i.type==='password'?'text':'password';
  ico.className=i.type==='password'?'fa-regular fa-eye':'fa-regular fa-eye-slash';
}
async function gasCall(action,payload){
  const p=new URLSearchParams({action,payload:JSON.stringify(payload||{})});
  const r=await fetch(GAS+'?'+p);
  if(!r.ok) throw new Error('Network error '+r.status);
  return r.json();
}
async function doLogin(){
  const u=document.getElementById('inp-user').value.trim();
  const p=document.getElementById('inp-pw').value;
  const errEl=document.getElementById('login-err');
  errEl.classList.remove('show');
  if(!u||!p){errEl.querySelector('#err-msg').textContent='Please enter username and password.';errEl.classList.add('show');return;}
  const btn=document.getElementById('btn-login');
  btn.classList.add('loading');
  document.getElementById('btn-txt').textContent='Signing in…';
  document.getElementById('page-loader').style.display='flex';
  try{
    const r=await gasCall('login',{username:u,password:p,role:ROLE});
    if(!r.ok){
      errEl.querySelector('#err-msg').textContent=r.error||'Invalid credentials.';
      errEl.classList.add('show');
      document.getElementById('inp-pw').value='';
    }else{
      sessionStorage.setItem('azb_user',JSON.stringify(r.data));
      window.location.href='admin.html';
    }
  }catch(e){
    errEl.querySelector('#err-msg').textContent='Connection error. Please try again.';
    errEl.classList.add('show');
  }finally{
    btn.classList.remove('loading');
    document.getElementById('btn-txt').textContent='Sign In';
    document.getElementById('page-loader').style.display='none';
  }
}
async function loadBranding(){
  try{
    const r=await gasCall('getConfig',{});
    if(r.ok&&r.data){
      const c=r.data;
      if(c.college_name) document.getElementById('hdr-college').textContent=c.college_name;
      if(c.dept_name) document.getElementById('hdr-dept').textContent=c.dept_name;
      if(c.subtitle1){const el=document.getElementById('hdr-sub');el.textContent=c.subtitle1;el.style.display='block';}
      if(c.dept_name) document.getElementById('wm-dept').innerHTML=c.dept_name;
      if(c.college_name) document.getElementById('wm-college').textContent=c.college_name;
      if(c.logo2_url){
        document.getElementById('hdr-logo2').src=c.logo2_url;
        document.getElementById('hdr-logo2-wrap').style.display='inline-flex';
      }
    }
  }catch(e){}
}
['inp-user','inp-pw'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();}));
loadBranding();
</script>
</body>
</html>
