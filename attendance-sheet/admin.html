<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — AZBT Attendance System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --maroon:#8B2635;--maroon-light:#A63347;--maroon-pale:#F9EFF1;
  --maroon-soft:rgba(139,38,53,.08);
  --gold:#C49A3C;--gold-light:#D4AF5A;
  --bg:#F8F6F3;--bg2:#F1EDE8;--bg3:#E9E3DC;
  --white:#FFFFFF;
  --c:#1C1917;--c2:#3D3530;--c3:#78706A;--c4:#B0A89F;
  --border:#E2DAD4;--border2:#EDE8E3;
  --shadow:0 4px 16px rgba(0,0,0,.07);
  --sb:256px;
  --topbar:54px;
  --font-serif:'Lora',Georgia,serif;
  --font-sans:'Plus Jakarta Sans',system-ui,sans-serif;
}
html,body{height:100%;background:var(--bg);font-family:var(--font-sans);color:var(--c);-webkit-font-smoothing:antialiased;font-size:14px;overflow:hidden}

/* ── LAYOUT ── */
#shell{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sb);flex-shrink:0;height:100vh;
  background:linear-gradient(175deg,#3D0D1A 0%,#5A1220 40%,#7A1E30 100%);
  display:flex;flex-direction:column;overflow:hidden;
  position:relative;z-index:100;
  transition:width .28s cubic-bezier(.4,0,.2,1),transform .28s cubic-bezier(.4,0,.2,1);
  box-shadow:2px 0 20px rgba(0,0,0,.15);
}
.sidebar::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 60px,
    rgba(255,255,255,.015) 60px,rgba(255,255,255,.015) 61px
  );pointer-events:none;
}
.sb-head{
  padding:16px 14px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.sb-logo{
  width:36px;height:36px;object-fit:contain;
  border-radius:6px;background:rgba(255,255,255,.1);
  padding:3px;flex-shrink:0;
}
.sb-brand{overflow:hidden}
.sb-name{
  font-family:var(--font-serif);font-size:14.5px;font-weight:700;
  color:#fff;line-height:1.2;white-space:nowrap;
}
.sb-sub{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}

.sb-nav{flex:1;overflow-y:auto;padding:10px 8px;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.nav-section-label{
  font-size:8px;font-weight:800;letter-spacing:2px;
  text-transform:uppercase;color:rgba(255,255,255,.28);
  padding:10px 10px 5px;margin-top:6px;
}
.nav-section-label:first-child{margin-top:0}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:7px;
  color:rgba(255,255,255,.58);font-size:12.5px;font-weight:500;
  cursor:pointer;transition:all .15s;margin-bottom:1px;
  background:none;border:none;width:100%;text-align:left;
  font-family:var(--font-sans);
}
.nav-item .ni-ico{
  width:18px;text-align:center;font-size:12.5px;flex-shrink:0;opacity:.75;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav-item.active .ni-ico{opacity:1}
.nav-badge{
  margin-left:auto;background:rgba(255,255,255,.12);
  color:rgba(255,255,255,.7);font-size:10px;
  padding:1px 7px;border-radius:10px;font-weight:600;
}

.sb-foot{
  padding:14px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0;
}
.sb-user{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.sb-avatar{
  width:36px;height:36px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#5A1220;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;
}
.sb-uname{font-size:13px;font-weight:700;color:#fff;line-height:1.2}
.sb-urole{font-size:9.5px;color:var(--gold-light);font-weight:500}
.btn-logout{
  width:100%;padding:8px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:7px;color:rgba(255,255,255,.6);
  font-family:var(--font-sans);font-size:12px;font-weight:500;
  cursor:pointer;transition:all .18s;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.btn-logout:hover{
  background:rgba(200,50,50,.2);
  border-color:rgba(200,80,80,.3);color:#fff;
}

/* ── OVERLAY (mobile) ── */
.sb-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.4);z-index:99;
}
.sb-overlay.show{display:block}

/* ── MAIN AREA ── */
.main-area{
  flex:1;display:flex;flex-direction:column;
  height:100vh;overflow:hidden;min-width:0;
}

/* ── TOPBAR ── */
.topbar{
  height:var(--topbar);flex-shrink:0;
  background:var(--white);
  border-bottom:1px solid var(--border2);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
  z-index:50;position:relative;
}
.tb-left{display:flex;align-items:center;gap:10px}
.menu-btn{
  display:none;background:none;border:none;
  font-size:17px;cursor:pointer;color:var(--c2);
  width:32px;height:32px;align-items:center;justify-content:center;
  border-radius:6px;transition:background .15s;
}
.menu-btn:hover{background:var(--bg2)}
.tb-title{
  font-family:var(--font-serif);font-size:18px;font-weight:600;color:var(--c);
}
.tb-right{display:flex;align-items:center;gap:8px}
.ay-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;
  background:var(--maroon-soft);border:1px solid rgba(139,38,53,.18);color:var(--maroon);
}
.tb-refresh-btn{
  width:30px;height:30px;border-radius:6px;
  background:none;border:1.5px solid var(--border);
  color:var(--c3);cursor:pointer;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.tb-refresh-btn:hover{border-color:var(--maroon);color:var(--maroon);background:var(--maroon-pale)}
.tb-refresh-btn.spinning i{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── IFRAME CONTAINER ── */
.iframe-wrap{
  flex:1;overflow:hidden;position:relative;
}
.page-iframe{
  width:100%;height:100%;border:none;
  background:transparent;
}

/* ── PRINT/PDF OVERLAY ── */
#print-overlay{
  position:fixed;inset:0;background:#9A9A95;
  z-index:2000;overflow-y:auto;display:none;
  flex-direction:column;
}
.print-bar{
  background:var(--white);border-bottom:1px solid var(--border);
  height:54px;display:flex;align-items:center;
  justify-content:space-between;padding:0 22px;
  position:sticky;top:0;z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.1);flex-shrink:0;
}
.print-bar-left{display:flex;align-items:center;gap:12px}
.print-sheet-count{font-size:12px;color:var(--c3);font-weight:500}
.print-bar-right{display:flex;align-items:center;gap:8px}
.btn-print{
  padding:9px 20px;background:var(--maroon);border:none;
  border-radius:7px;color:#fff;font-family:var(--font-sans);
  font-size:12.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:7px;
  transition:all .18s;
  box-shadow:0 2px 8px rgba(139,38,53,.25);
}
.btn-print:hover{background:var(--maroon-light)}
.btn-pdf{
  padding:9px 20px;background:var(--white);border:1.5px solid var(--border);
  border-radius:7px;color:var(--c2);font-family:var(--font-sans);
  font-size:12.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:7px;
  transition:all .18s;
}
.btn-pdf:hover{border-color:var(--maroon);color:var(--maroon);background:var(--maroon-pale)}
.print-pages{
  flex:1;padding:24px;display:flex;flex-direction:column;align-items:center;gap:24px;
}

/* ── A4 SHEETS ── */
.a4-sheet{
  background:#fff;font-family:'Times New Roman',Times,serif;
  color:#111;box-shadow:0 6px 30px rgba(0,0,0,.18);
}
.a4-sheet.portrait{width:210mm;min-height:297mm;padding:12mm 13mm 15mm;position:relative}
.a4-sheet.landscape{width:297mm;min-height:210mm;padding:10mm 12mm 13mm;position:relative}

/* Sheet Header */
.sh-header{text-align:center;padding-bottom:8px;margin-bottom:8px;border-bottom:2.5px solid #111}
.sh-logos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.sh-logo-img{width:56px;height:56px;object-fit:contain}
.sh-college{font-size:15pt;font-weight:700;color:#111;line-height:1.25;font-family:'Times New Roman',serif}
.sh-est{font-size:7.5pt;color:#555;margin-top:2px;letter-spacing:.3px}
.sh-dept{font-size:10.5pt;font-weight:700;color:#111;margin-top:3px}
.sh-subtitle{font-size:8pt;color:#444;margin-top:2px;font-style:italic}
.sh-hr{border:none;border-top:1px solid #999;margin:5px 0}

/* Continuation header (page 2+) */
.sh-cont-header{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:6px;margin-bottom:8px;border-bottom:1.5px solid #555;
  font-size:8.5pt;
}
.sh-cont-ev{font-weight:700;color:#111}
.sh-cont-date{color:#444}

/* Event title */
.sh-ev-title{text-align:center;margin-bottom:8px}
.sh-ev-title-main{
  font-size:11pt;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;border-bottom:1.5px solid #111;
  display:inline-block;padding-bottom:2px;
}
.sh-ev-title-sub{
  font-size:8pt;font-weight:400;color:#333;letter-spacing:.3px;
  display:block;margin-top:3px;font-style:italic;text-transform:none;
}
.sh-attendance-label{
  font-size:8pt;color:#555;display:block;margin-top:2px;
  letter-spacing:.5px;text-transform:uppercase;
}

/* Meta grid */
.sh-meta{
  border:1px solid #AAA;display:grid;
  grid-template-columns:1fr 1fr;margin-bottom:8px;font-size:8pt;
}
.sh-meta-cell{
  padding:4px 8px;border-right:1px solid #CCC;
  border-bottom:1px solid #CCC;display:flex;gap:5px;line-height:1.5;
}
.sh-meta-cell:nth-child(2n){border-right:none}
.sh-meta-cell:nth-last-child(-n+2){border-bottom:none}
.sh-meta-cell.full{grid-column:1/-1;border-right:none}
.sh-meta-label{font-weight:700;min-width:85px;white-space:nowrap;color:#222}
.sh-meta-val{color:#111}

/* Table */
.sh-table{width:100%;border-collapse:collapse;font-size:8pt;margin-bottom:8px}
.sh-table th{
  background:#1C1917;color:#fff;padding:5px 6px;
  font-weight:700;font-size:7.5pt;letter-spacing:.3px;
  border:1px solid #1C1917;text-align:left;white-space:nowrap;
}
.sh-table td{border:1px solid #AAA;padding:4px 5px;vertical-align:middle}
.sh-table tr:nth-child(even) td{background:#F9F8F7}
.td-sno{text-align:center;width:22px;font-weight:700}
.td-sig{min-width:55px;height:26px}

/* Totals */
.sh-totals{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.sh-total-box{border:1px solid #666;text-align:center;min-width:110px}
.sh-total-label{
  background:#333;color:#fff;font-size:7pt;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;padding:3px 7px;
}
.sh-total-val{font-size:20pt;font-weight:700;color:#111;padding:5px 10px;line-height:1}

/* Signature footer */
.sh-sig-footer{
  border-top:1.5px solid #111;padding-top:10px;
  margin-top:auto;
}
.sh-sig-row{display:flex;gap:10px;justify-content:flex-end}
.sh-sig-block{text-align:center;flex:1;max-width:150px}
.sh-sig-space{height:44px;border-bottom:1px solid #555;margin-bottom:5px}
.sh-sig-name{font-size:8.5pt;font-weight:700;color:#111}
.sh-sig-role{font-size:7.5pt;color:#555;margin-top:1px;font-style:italic}
.sh-sig-desig{font-size:8pt;color:#333;margin-top:1px}
.sh-sig-dept{font-size:7.5pt;color:#555;margin-top:1px}

/* Page number */
.sh-page-num{
  text-align:center;font-size:7pt;color:#777;
  margin-top:8px;padding-top:6px;
  border-top:1px dashed #CCC;
}
.sh-watermark{
  text-align:center;margin-top:6px;
  font-size:6.5pt;color:#999;font-style:italic;
}

/* ── TOAST ── */
#toast-area{
  position:fixed;top:16px;right:16px;z-index:9000;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast-item{
  padding:10px 16px;border-radius:8px;font-size:12.5px;font-weight:600;
  box-shadow:0 8px 32px rgba(0,0,0,.15);animation:toastIn .2s ease;
  max-width:320px;display:flex;align-items:center;gap:8px;pointer-events:all;
  border:1px solid;
}
.toast-ok{background:#EAF5EF;color:#1D6842;border-color:#B8DECA}
.toast-err{background:#FDF0F0;color:#8B2020;border-color:#F0BFBF}
.toast-info{background:#fff;color:#3D3530;border-color:#E2DAD4}
@keyframes toastIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

/* ── GLOBAL LOADER ── */
#global-loader{
  position:fixed;inset:0;background:rgba(248,246,243,.94);
  z-index:9999;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
}
.gl-ring{width:38px;height:38px;border:2.5px solid #E2DAD4;border-top-color:#8B2635;border-radius:50%;animation:spin .7s linear infinite}
#gl-msg{font-size:12px;color:#78706A;font-weight:500}

/* ── MOBILE ── */
@media(max-width:900px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;
    transform:translateX(calc(-1 * var(--sb)));
    z-index:200;
  }
  .sidebar.open{transform:translateX(0)}
  .sb-overlay{display:none}
  .sb-overlay.show{display:block}
  .menu-btn{display:flex!important}
  #shell{display:block}
  .main-area{height:100vh}
}
@media(min-width:901px){
  .menu-btn{display:none!important}
  .sb-overlay{display:none!important}
}

/* ── PRINT STYLES ── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{margin:0;padding:0;background:#fff!important}
  #shell,#global-loader,#toast-area,#global-loader{display:none!important}
  #print-overlay{
    position:static!important;background:#fff!important;
    overflow:visible!important;display:block!important;
  }
  .no-print,.print-bar{display:none!important}
  .print-pages{padding:0!important;gap:0!important;display:block!important}
  .a4-sheet{
    box-shadow:none!important;
    page-break-after:always;break-after:page;
  }
  .a4-sheet:last-child{page-break-after:avoid;break-after:avoid}
  .a4-sheet.portrait{width:210mm!important;padding:10mm 12mm 12mm!important;min-height:0!important}
  .a4-sheet.landscape{width:297mm!important;padding:9mm 11mm 11mm!important;min-height:0!important}
  @page{margin:0;size:A4}
}
</style>
</head>
<body>

<div id="global-loader" style="display:none"><div class="gl-ring"></div><span id="gl-msg">Loading…</span></div>
<div id="toast-area"></div>

<!-- PRINT OVERLAY -->
<div id="print-overlay">
  <div class="print-bar no-print">
    <div class="print-bar-left">
      <button class="btn-pdf" onclick="closePrintOverlay()" style="gap:6px">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
      <span class="print-sheet-count" id="print-count">0 sheets</span>
    </div>
    <div class="print-bar-right">
      <button class="btn-pdf" onclick="downloadPDF()">
        <i class="fa-solid fa-file-pdf" style="color:#C0392B"></i> Download PDF
      </button>
      <button class="btn-print" onclick="window.print()">
        <i class="fa-solid fa-print"></i> Print
      </button>
    </div>
  </div>
  <div class="print-pages" id="print-pages"></div>
</div>

<div id="shell">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <img id="sb-logo-img" class="sb-logo" src="https://static.wixstatic.com/media/81ba89_81dcdb9d1e384b618fdc78760c61c426~mv2.png" alt="" onerror="this.style.display='none'">
      <div class="sb-brand">
        <div class="sb-name" id="sb-college-name">Loyola College</div>
        <div class="sb-sub">Admin Dashboard</div>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="nav-section-label">Main</div>
      <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard',this)">
        <span class="ni-ico"><i class="fa-solid fa-gauge-high"></i></span>Dashboard
      </button>
      <button class="nav-item" data-page="generate" onclick="navigate('generate',this)">
        <span class="ni-ico"><i class="fa-solid fa-file-circle-plus"></i></span>Generate Sheet
      </button>

      <div class="nav-section-label">Management</div>
      <button class="nav-item" data-page="students" onclick="navigate('students',this)">
        <span class="ni-ico"><i class="fa-solid fa-users"></i></span>Students
      </button>
      <button class="nav-item" data-page="staff" onclick="navigate('staff',this)">
        <span class="ni-ico"><i class="fa-solid fa-chalkboard-user"></i></span>Staff Directory
      </button>
      <button class="nav-item" data-page="classes" onclick="navigate('classes',this)">
        <span class="ni-ico"><i class="fa-solid fa-layer-group"></i></span>Classes
      </button>
      <button class="nav-item" data-page="academic" onclick="navigate('academic',this)">
        <span class="ni-ico"><i class="fa-solid fa-calendar-days"></i></span>Academic Years
      </button>

      <div class="nav-section-label">System</div>
      <button class="nav-item" data-page="config" onclick="navigate('config',this)">
        <span class="ni-ico"><i class="fa-solid fa-gear"></i></span>Configuration
      </button>
      <button class="nav-item" data-page="users" onclick="navigate('users',this)">
        <span class="ni-ico"><i class="fa-solid fa-key"></i></span>User Accounts
      </button>
      <button class="nav-item" data-page="logs" onclick="navigate('logs',this)">
        <span class="ni-ico"><i class="fa-solid fa-clock-rotate-left"></i></span>Activity Logs
      </button>
      <button class="nav-item" data-page="myaccount" onclick="navigate('myaccount',this)">
        <span class="ni-ico"><i class="fa-solid fa-circle-user"></i></span>My Account
      </button>
    </nav>

    <div class="sb-foot">
      <div class="sb-user">
        <div class="sb-avatar" id="sb-avatar">A</div>
        <div>
          <div class="sb-uname" id="sb-username">Admin</div>
          <div class="sb-urole" id="sb-role">Administrator</div>
        </div>
      </div>
      <button class="btn-logout" onclick="doLogout()">
        <i class="fa-solid fa-right-from-bracket"></i> Sign Out
      </button>
    </div>
  </aside>

  <div class="sb-overlay" id="sb-overlay" onclick="closeSidebar()"></div>

  <!-- MAIN -->
  <div class="main-area">
    <div class="topbar">
      <div class="tb-left">
        <button class="menu-btn" id="menu-btn" onclick="toggleSidebar()">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1 class="tb-title" id="tb-title">Dashboard</h1>
      </div>
      <div class="tb-right">
        <span class="ay-chip" id="ay-chip">
          <i class="fa-solid fa-calendar-check"></i><span id="ay-chip-text">Loading…</span>
        </span>
        <button class="tb-refresh-btn" id="tb-refresh" onclick="refreshCurrentPage()" title="Refresh">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>

    <div class="iframe-wrap">
      <iframe class="page-iframe" id="main-frame" src="" title="Content"></iframe>
    </div>
  </div>
</div>

<script>
const GAS='https://script.google.com/macros/s/AKfycbxWWpiTVJZ6O-oPXIJ4h6W4JMmOfABONQfrwcQ0rh-K_6TnRFWHrFI7mYwjEZLadTjWsw/exec';
const BASE_PATH = (()=>{
  const p = window.location.pathname;
  return p.substring(0, p.lastIndexOf('/')+1);
})();

const PAGE_TITLES = {
  dashboard:'Dashboard', generate:'Generate Attendance Sheet',
  students:'Student Database', staff:'Staff Directory', classes:'Classes',
  academic:'Academic Years', config:'Sheet Configuration',
  users:'User Accounts', logs:'Activity Logs', myaccount:'My Account'
};

// ── AUTH ──
let CU = null;
function checkAuth(){
  try{ CU = JSON.parse(sessionStorage.getItem('azb_user')); }catch(e){ CU=null; }
  if(!CU){
    window.location.href = BASE_PATH + 'login.html';
    return false;
  }
  return true;
}

// ── STATE ──
let CURRENT_PAGE = 'dashboard';
let CFG = {};
let PRINT_DATA = null;

// ── API ──
async function gasCall(action, payload){
  const p = new URLSearchParams({action, payload: JSON.stringify(payload||{})});
  const r = await fetch(GAS+'?'+p);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// ── TOAST ──
function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = `toast-item toast-${type==='ok'?'ok':type==='err'?'err':'info'}`;
  el.innerHTML = `<i class="fa-solid ${type==='ok'?'fa-circle-check':type==='err'?'fa-circle-exclamation':'fa-circle-info'}"></i>${escH(msg)}`;
  document.getElementById('toast-area').appendChild(el);
  setTimeout(()=>el.remove(), 3600);
}
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ── LOADER ──
function showLoader(msg='Loading…'){
  document.getElementById('global-loader').style.display='flex';
  document.getElementById('gl-msg').textContent=msg;
}
function hideLoader(){document.getElementById('global-loader').style.display='none'}

// ── NAVIGATION ──
function navigate(page, el){
  CURRENT_PAGE = page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  else {
    const btn = document.querySelector(`.nav-item[data-page="${page}"]`);
    if(btn) btn.classList.add('active');
  }
  document.getElementById('tb-title').textContent = PAGE_TITLES[page]||page;
  const frame = document.getElementById('main-frame');
  frame.src = BASE_PATH + page + '.html';
  closeSidebar();
}

function refreshCurrentPage(){
  const btn = document.getElementById('tb-refresh');
  btn.classList.add('spinning');
  const frame = document.getElementById('main-frame');
  frame.src = frame.src;
  setTimeout(()=>btn.classList.remove('spinning'), 800);
}

// ── SIDEBAR ──
function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sb-overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sb-overlay').classList.remove('show');
}

// ── LOGOUT ──
function doLogout(){
  sessionStorage.removeItem('azb_user');
  window.location.href = BASE_PATH + 'login.html';
}

// ── PRINT OVERLAY ──
function showPrintOverlay(htmlContent, sheetCount, filename){
  PRINT_DATA = {htmlContent, filename};
  document.getElementById('print-pages').innerHTML = htmlContent;
  document.getElementById('print-count').textContent = sheetCount + ' sheet'+(sheetCount!==1?'s':'');
  const ov = document.getElementById('print-overlay');
  ov.style.display = 'flex';
  ov.scrollTop = 0;
}
function closePrintOverlay(){
  document.getElementById('print-overlay').style.display = 'none';
  document.getElementById('print-pages').innerHTML = '';
  PRINT_DATA = null;
}
function downloadPDF(){
  if(PRINT_DATA && PRINT_DATA.filename){
    // Set suggested filename via title trick
    const oldTitle = document.title;
    document.title = PRINT_DATA.filename;
    window.print();
    setTimeout(()=>{ document.title = oldTitle; }, 500);
  } else {
    window.print();
  }
}

// ── POSTMESSAGE FROM IFRAMES ──
window.addEventListener('message', function(e){
  const d = e.data;
  if(!d || typeof d !== 'object') return;
  switch(d.type){
    case 'toast':
      toast(d.msg, d.variant||'info');
      break;
    case 'showLoader':
      showLoader(d.msg||'Loading…');
      break;
    case 'hideLoader':
      hideLoader();
      break;
    case 'printOverlay':
      showPrintOverlay(d.html, d.count||1, d.filename||'attendance.pdf');
      break;
    case 'navigate':
      navigate(d.page);
      break;
    case 'updateAY':
      document.getElementById('ay-chip-text').textContent = d.label||'—';
      break;
    case 'logout':
      doLogout();
      break;
  }
});

// ── BOOT ──
async function boot(){
  if(!checkAuth()) return;
  // Set user info
  document.getElementById('sb-avatar').textContent = (CU.fullName||CU.username||'A')[0].toUpperCase();
  document.getElementById('sb-username').textContent = CU.fullName||CU.username;
  document.getElementById('sb-role').textContent = CU.role==='admin'?'Administrator':'Staff';
  // Load config for branding
  try{
    const r = await gasCall('getConfig',{});
    if(r.ok && r.data){
      CFG = r.data;
      const cn = CFG.college_name||'';
      if(cn) document.getElementById('sb-college-name').textContent = cn.split(' (')[0];
      if(CFG.logo1_url) document.getElementById('sb-logo-img').src = CFG.logo1_url;
    }
    // Active year
    const ayR = await gasCall('getAcademicYears',{});
    if(ayR.ok && ayR.data){
      const active = ayR.data.find(a => String(a.Active).toUpperCase() === 'TRUE');
      document.getElementById('ay-chip-text').textContent = active?active.Label:'No Active Year';
    }
  }catch(e){ console.warn('Boot config error:',e); }
  // Navigate to dashboard
  navigate('dashboard');
}

boot();
</script>
