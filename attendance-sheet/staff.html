<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Directory</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --maroon:#8B2635;--maroon-light:#A63347;--maroon-pale:#F9EFF1;--maroon-soft:rgba(139,38,53,.08);
  --bg:#F8F6F3;--bg2:#F1EDE8;--white:#FFFFFF;
  --c:#1C1917;--c2:#3D3530;--c3:#78706A;--c4:#B0A89F;
  --border:#E2DAD4;--border2:#EDE8E3;
  --green:#1D6842;--green-bg:#EAF5EF;--green-border:#B8DECA;
  --red:#8B2020;--red-bg:#FDF0F0;--red-border:#F0BFBF;
  --r:8px;--r2:6px;--r3:12px;
  --font-serif:'Lora',Georgia,serif;--font-sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
}
html,body{background:var(--bg);font-family:var(--font-sans);color:var(--c);-webkit-font-smoothing:antialiased;font-size:14px;min-height:100vh}
body{padding:22px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.sec-header{margin-bottom:20px}
.sec-header h2{font-family:var(--font-serif);font-size:24px;font-weight:600}
.sec-header p{font-size:12.5px;color:var(--c3);margin-top:3px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1}
.toolbar-right{display:flex;align-items:center;gap:8px}
.search-box{display:flex;align-items:center;gap:7px;background:var(--white);border:1.5px solid var(--border);border-radius:var(--r2);padding:7px 11px;min-width:220px;transition:border-color .15s}
.search-box:focus-within{border-color:var(--maroon)}
.search-box i{color:var(--c4);font-size:12px}
.search-box input{flex:1;border:none;background:none;font-size:13px;outline:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r2);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid transparent;white-space:nowrap;font-family:var(--font-sans)}
.btn-primary{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.btn-primary:hover{background:var(--maroon-light)}
.btn-ghost{background:var(--white);color:var(--c2);border-color:var(--border)}
.btn-ghost:hover{border-color:var(--maroon);color:var(--maroon);background:var(--maroon-pale)}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-xs{padding:4px 9px;font-size:11px}
.table-wrap{background:var(--white);border:1px solid var(--border2);border-radius:var(--r3);overflow:auto;box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--bg2);color:var(--c3);font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:10px 13px;text-align:left;border-bottom:1.5px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody td{padding:10px 13px;border-bottom:1px solid var(--border2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(139,38,53,.012)}
.tbl-empty{padding:40px;text-align:center;color:var(--c4);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tbl-empty i{font-size:22px;opacity:.4}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid}
.badge-green{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.badge-gray{background:var(--bg2);color:var(--c3);border-color:var(--border)}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal-box{background:var(--white);border-radius:14px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 70px rgba(0,0,0,.2);animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(-6px)scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border2);position:sticky;top:0;background:var(--white);z-index:2}
.modal-head h3{font-family:var(--font-serif);font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal-cl{width:30px;height:30px;border-radius:50%;background:none;border:none;cursor:pointer;color:var(--c3);display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:14px}
.modal-cl:hover{background:var(--bg2);color:var(--c)}
.modal-body{padding:18px 20px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border2);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--white)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.span2{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--c3)}
.field input,.field select{padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--r2);color:var(--c);background:var(--white);font-size:13px;width:100%;transition:all .15s;font-family:var(--font-sans)}
.field input:focus,.field select:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 3px rgba(139,38,53,.06)}
.staff-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:4px}
.staff-card{background:var(--white);border:1px solid var(--border2);border-radius:var(--r3);padding:16px;transition:box-shadow .2s;box-shadow:var(--shadow-sm)}
.staff-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.sc-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.sc-avatar{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--maroon-soft),var(--maroon-pale));color:var(--maroon);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;font-family:var(--font-serif)}
.sc-name{font-size:14px;font-weight:700;color:var(--c);line-height:1.3}
.sc-desig{font-size:11.5px;color:var(--c3);margin-top:2px}
.sc-meta{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--c3)}
.sc-meta-row{display:flex;align-items:center;gap:6px}
.sc-meta-row i{width:12px;color:var(--c4);font-size:10px}
.sc-actions{display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border2)}
.view-toggle{display:flex;border:1.5px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-right:4px}
.vt-btn{padding:6px 10px;background:transparent;border:none;color:var(--c3);cursor:pointer;font-size:12px;transition:all .15s}
.vt-btn.active{background:var(--maroon);color:#fff}
@media(max-width:640px){.g2{grid-template-columns:1fr!important}body{padding:14px}.staff-card-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="sec-header">
  <h2>Staff Directory</h2>
  <p>Staff members appear in signatory dropdowns when generating attendance sheets.</p>
</div>
<div class="toolbar">
  <div class="toolbar-left">
    <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="sf-q" type="text" placeholder="Search name or designation…" oninput="filterStaff()"></div>
  </div>
  <div class="toolbar-right">
    <div class="view-toggle">
      <button class="vt-btn active" id="vt-card" onclick="setView('card',this)" title="Card view"><i class="fa-solid fa-grip"></i></button>
      <button class="vt-btn" id="vt-table" onclick="setView('table',this)" title="Table view"><i class="fa-solid fa-list"></i></button>
    </div>
    <button class="btn btn-primary btn-xs" style="padding:7px 14px;font-size:12.5px" onclick="openAdd()"><i class="fa-solid fa-plus"></i> Add Staff</button>
  </div>
</div>
<div id="card-view"><div class="staff-card-grid" id="sf-cards"></div><div class="tbl-empty" id="sf-card-empty" style="display:none"><i class="fa-solid fa-chalkboard-user"></i>No staff records yet.</div></div>
<div id="table-view" style="display:none">
  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Qualification</th><th>Designation</th><th>Department</th><th>College</th><th>Contact</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="sf-tbody"></tbody>
    </table>
    <div class="tbl-empty" id="sf-empty" style="display:none"><i class="fa-solid fa-chalkboard-user"></i>No staff records yet.</div>
  </div>
</div>

<!-- STAFF MODAL -->
<div class="modal-ov" id="m-staff" style="display:none">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="m-sf-title"><i class="fa-solid fa-chalkboard-user" style="color:var(--maroon)"></i>Add Staff</h3>
      <button class="modal-cl" onclick="closeM()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="g2">
        <div class="field span2"><label>Full Name <span style="color:var(--maroon)">*</span></label><input id="sf-name" type="text" placeholder="Dr. / Mr. / Ms. Full Name"></div>
        <div class="field"><label>Qualification</label><input id="sf-qual" type="text" placeholder="Ph.D., M.Sc., M.Phil."></div>
        <div class="field"><label>Designation</label><input id="sf-desig" type="text" placeholder="Associate Professor & Head"></div>
        <div class="field"><label>Department</label><input id="sf-dept" type="text"></div>
        <div class="field"><label>College / Institution</label><input id="sf-college" type="text"></div>
        <div class="field"><label>Email</label><input id="sf-email" type="email"></div>
        <div class="field"><label>Contact</label><input id="sf-con" type="tel"></div>
        <div class="field"><label>Status</label><select id="sf-active"><option value="TRUE">Active</option><option value="FALSE">Inactive</option></select></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeM()">Cancel</button>
      <button class="btn btn-primary" onclick="saveStaff()"><i class="fa-solid fa-floppy-disk"></i> Save Staff</button>
    </div>
  </div>
</div>

<script>
const GAS='https://script.google.com/macros/s/AKfycbxWWpiTVJZ6O-oPXIJ4h6W4JMmOfABONQfrwcQ0rh-K_6TnRFWHrFI7mYwjEZLadTjWsw/exec';
function msg(t,m,v){window.parent.postMessage({type:t,msg:m,variant:v},'*')}
function showLoader(m){window.parent.postMessage({type:'showLoader',msg:m},'*')}
function hideLoader(){window.parent.postMessage({type:'hideLoader'},'*')}
async function gasCall(action,payload){const p=new URLSearchParams({action,payload:JSON.stringify(payload||{})});const r=await fetch(GAS+'?'+p);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function v(id){return document.getElementById(id)?.value?.trim()||''}
function sv(id,val){const el=document.getElementById(id);if(el)el.value=val||''}

let ALL_STAFF=[], EDIT_ID=null, VIEW='card', CFG={};

async function loadAll(){
  try{
    const[sfR,cfgR]=await Promise.all([gasCall('getStaff',{}),gasCall('getConfig',{})]);
    if(sfR.ok) ALL_STAFF=sfR.data||[];
    if(cfgR.ok) CFG=cfgR.data||{};
    renderView();
  }catch(e){msg('toast','Load error: '+e.message,'err')}
}

function setView(v,el){
  VIEW=v;
  document.querySelectorAll('.vt-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('card-view').style.display=v==='card'?'block':'none';
  document.getElementById('table-view').style.display=v==='table'?'block':'none';
  renderView();
}

function filterStaff(){renderView()}

function renderView(){
  const q=(document.getElementById('sf-q').value||'').toLowerCase();
  let d=[...ALL_STAFF];
  if(q) d=d.filter(s=>(s.Name||'').toLowerCase().includes(q)||(s.Designation||'').toLowerCase().includes(q)||(s.Department||'').toLowerCase().includes(q));
  if(VIEW==='card') renderCards(d); else renderTable(d);
}

function renderCards(d){
  const el=document.getElementById('sf-cards');
  const empty=document.getElementById('sf-card-empty');
  if(!d.length){el.innerHTML='';empty.style.display='flex';return}
  empty.style.display='none';
  el.innerHTML=d.map(s=>`
    <div class="staff-card">
      <div class="sc-top">
        <div class="sc-avatar">${(s.Name||'?')[0].toUpperCase()}</div>
        <div style="flex:1;min-width:0">
          <div class="sc-name">${esc(s.Name)}</div>
          <div class="sc-desig">${esc(s.Designation||'—')}</div>
          ${s.Qualification?`<div style="font-size:10.5px;color:var(--c4);margin-top:1px">${esc(s.Qualification)}</div>`:''}
        </div>
        <span class="badge ${s.Active==='FALSE'?'badge-gray':'badge-green'}" style="flex-shrink:0">${s.Active==='FALSE'?'Inactive':'Active'}</span>
      </div>
      <div class="sc-meta">
        ${s.Department?`<div class="sc-meta-row"><i class="fa-solid fa-building"></i>${esc(s.Department)}</div>`:''}
        ${s.College?`<div class="sc-meta-row"><i class="fa-solid fa-university"></i>${esc(s.College)}</div>`:''}
        ${s.Contact?`<div class="sc-meta-row"><i class="fa-solid fa-phone"></i>${esc(s.Contact)}</div>`:''}
        ${s.Email?`<div class="sc-meta-row"><i class="fa-solid fa-envelope"></i>${esc(s.Email)}</div>`:''}
      </div>
      <div class="sc-actions">
        <button class="btn btn-ghost btn-xs" onclick="editStaff('${s.ID}')"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
        <button class="btn btn-danger btn-xs" onclick="deleteStaff('${s.ID}')"><i class="fa-solid fa-trash"></i> Delete</button>
      </div>
    </div>`).join('');
}

function renderTable(d){
  const tbody=document.getElementById('sf-tbody');
  const empty=document.getElementById('sf-empty');
  if(!d.length){tbody.innerHTML='';empty.style.display='flex';return}
  empty.style.display='none';
  tbody.innerHTML=d.map(s=>`<tr>
    <td><strong>${esc(s.Name)}</strong>${s.Qualification?`<div style="font-size:11px;color:var(--c4)">${esc(s.Qualification)}</div>`:''}</td>
    <td style="font-size:12px">${esc(s.Qualification||'—')}</td>
    <td>${esc(s.Designation||'—')}</td>
    <td style="font-size:12px">${esc(s.Department||'—')}</td>
    <td style="font-size:11.5px">${esc(s.College||'—')}</td>
    <td style="font-size:12px">${esc(s.Contact||'—')}</td>
    <td><span class="badge ${s.Active==='FALSE'?'badge-gray':'badge-green'}">${s.Active==='FALSE'?'Inactive':'Active'}</span></td>
    <td style="white-space:nowrap">
      <button class="btn btn-ghost btn-xs" onclick="editStaff('${s.ID}')"><i class="fa-solid fa-pen-to-square"></i></button>
      <button class="btn btn-danger btn-xs" style="margin-left:3px" onclick="deleteStaff('${s.ID}')"><i class="fa-solid fa-trash"></i></button>
    </td></tr>`).join('');
}

function openAdd(){
  EDIT_ID=null;
  document.getElementById('m-sf-title').innerHTML='<i class="fa-solid fa-chalkboard-user" style="color:var(--maroon)"></i>Add Staff';
  ['sf-name','sf-qual','sf-desig','sf-email','sf-con'].forEach(id=>sv(id,''));
  sv('sf-dept',CFG.dept_name||'');
  sv('sf-college',CFG.college_name||'');
  sv('sf-active','TRUE');
  document.getElementById('m-staff').style.display='flex';
}
function editStaff(id){
  const s=ALL_STAFF.find(x=>x.ID===id);if(!s)return;
  EDIT_ID=id;
  document.getElementById('m-sf-title').innerHTML='<i class="fa-solid fa-user-pen" style="color:var(--maroon)"></i>Edit Staff';
  sv('sf-name',s.Name);sv('sf-qual',s.Qualification);sv('sf-desig',s.Designation);
  sv('sf-dept',s.Department);sv('sf-college',s.College);sv('sf-email',s.Email);
  sv('sf-con',s.Contact);sv('sf-active',s.Active||'TRUE');
  document.getElementById('m-staff').style.display='flex';
}
async function saveStaff(){
  const name=v('sf-name');if(!name){msg('toast','Staff name is required.','err');return}
  showLoader('Saving staff…');
  try{
    const r=await gasCall('saveStaff',{id:EDIT_ID,name,qualification:v('sf-qual'),designation:v('sf-desig'),department:v('sf-dept'),college:v('sf-college'),email:v('sf-email'),contact:v('sf-con'),active:document.getElementById('sf-active').value});
    hideLoader();if(!r.ok){msg('toast',r.error||'Save failed.','err');return}
    closeM();await loadAll();
    await gasCall('addLog',{user:'admin',action:EDIT_ID?'EDIT STAFF':'ADD STAFF',detail:name});
    msg('toast','Staff saved.','ok');
  }catch(e){hideLoader();msg('toast','Error: '+e.message,'err')}
}
async function deleteStaff(id){
  if(!confirm('Delete this staff member?'))return;
  showLoader('Deleting…');
  try{
    await gasCall('deleteStaff',{id});hideLoader();await loadAll();msg('toast','Deleted.','ok');
  }catch(e){hideLoader();msg('toast','Error: '+e.message,'err')}
}
function closeM(){document.getElementById('m-staff').style.display='none'}
document.getElementById('m-staff').addEventListener('click',e=>{if(e.target===document.getElementById('m-staff'))closeM()});
loadAll();
setInterval(loadAll,60000);
</script>
</body>
</html>
